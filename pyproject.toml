[project]
name = "games-analytics"
version = "0.2.0"
description = "Local-first cross-platform game review analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4.0",
  "httpx>=0.28.0",
  "mcp>=2.0.0,<3",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "rich>=14.0.0",
  "typer>=0.16.0",
]

[project.scripts]
games-analytics = "games_analytics.cli:app"
games-analytics-mcp = "games_analytics.mcp_server:main"
games-analytics-batch-worker = "games_analytics.batch_worker:main"
steam-market = "games_analytics.cli:app"
steam-review-mcp = "games_analytics.mcp_server:main"
steam-review-batch-worker = "games_analytics.batch_worker:main"

[dependency-groups]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.1.0", "respx>=0.22.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["src/games_analytics", "src/steam_market"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "games_analytics/resources/prompts"
"taxonomy" = "games_analytics/resources/taxonomy"
"contracts" = "games_analytics/resources/contracts"
